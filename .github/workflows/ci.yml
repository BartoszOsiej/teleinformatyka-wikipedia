name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build site
        run: npm run build
      - name: Verify build output
        run: |
          if [ -d "build" ]; then
            echo "✓ build/ exists"
          else
            echo "✗ No build/ found"
            exit 1
          fi

  lint:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Check for broken markdown links
        run: grep -r '\[.*\](.*\.md)' docs/ 2>/dev/null | head -5 || echo '✓ Markdown links OK'
